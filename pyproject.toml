[build-system]
# hatchling writes every entry of `authors` and `maintainers` into a wheel's METADATA, as
# `Author-email:` and `Maintainer-email:`.
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kapps-triplestore-interface"
version = "2.3.0"
description = "SPARQL queries and atomic updates against a GraphDB triplestore, as callable Python methods."
readme = "README.md"
requires-python = ">=3.12,<4.0"
# `maintainers` is the narrower field of the two.
authors = [
    { name = "Jan-Felix Klein", email = "jfklein@kth.se" },
    { name = "Nico Brandt", email = "nico.g.brandt@gmail.com" },
    { name = "Sören Weindel", email = "soeren.weindel@kit.edu" },
    { name = "Etienne Hoffmann", email = "etienne.hoffmann@kit.edu" },
]
maintainers = [
    { name = "Etienne Hoffmann", email = "etienne.hoffmann@kit.edu" },
    { name = "Sören Weindel", email = "soeren.weindel@kit.edu" },
]
# Both halves are asserted before a release goes out: the declaration here, and the file inside
# the built wheel.
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Topic :: Database :: Front-Ends",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Spelled as PEP 440 ranges.
dependencies = [
    "rdflib==7.1.3",
    "requests>=2.32.3,<3.0.0",
    "python-snappy>=0.7.3,<0.8.0",
    "pydantic>=2.11.7,<3.0.0",
    "regex>=2024.11.6,<2025.0.0",
    # Declared because `GraphDB.query` names one of its exceptions, `ProtocolError`, to tell a
    # connection the store closed from one it never opened. `requests` already requires it, and
    # this is the range that `requests` admits, so nothing resolves differently.
    "urllib3>=1.21.1,<3",
]

[project.urls]
# Distribution names use hyphens, repository names use underscores. PyPI normalises the one and
# GitHub does not normalise the other, so they are simply different names for the same thing.
Homepage = "https://github.com/circularfactory/kapps_triplestore_interface"
Changelog = "https://github.com/circularfactory/kapps_triplestore_interface/blob/main/CHANGELOG.md"
# The project this one was forked from.
"Origin project" = "https://github.com/JaFeKl/graph_db_interface"

[tool.hatch.build.targets.wheel]
# PEP 621 has no way to say which directory is the package, and the directory name differs
# from the distribution name by an underscore. hatchling collapses the path to its last component,
# so the wheel carries `kapps_triplestore_interface/` at the top, and the checkout on `sys.path`
# cannot shadow the installed wheel.
packages = ["src/kapps_triplestore_interface"]

[dependency-groups]
dev = [
    "black>=25.1.0,<26.0.0",
    "pytest>=8.2.0,<9.0.0",
    "pylint>=3.3.4,<4.0.0",
]

[tool.pylint."MESSAGES CONTROL"]
disable = [
  "broad-exception-caught",
  "missing-function-docstring",
  "missing-module-docstring",
  "line-too-long",
  "logging-fstring-interpolation",
  "pointless-string-statement",
  "protected-access",
  "redefined-builtin",
  "too-many-ancestors",
  "too-many-arguments",
  "too-many-branches",
  "too-many-instance-attributes",
  "too-many-lines",
  "too-many-locals",
  "too-many-nested-blocks",
  "too-many-positional-arguments",
  "too-many-public-methods",
  "too-many-return-statements",
  "too-many-statements",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "live: needs a reachable GraphDB (the TRIPLESTORE_* environment variables). Applied automatically to every test that requests the `db` fixture, directly or through another fixture, so it cannot drift out of step with what a test needs. `-m 'not live'` selects the tier that runs without a triple store. That tier is for a laptop, not for CI -- CI provisions a disposable GraphDB and runs the whole suite, because a green tick standing for a small part of this suite would be worse than a red one.",
]
log_cli = "true"
log_cli_level = "info"